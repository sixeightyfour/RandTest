name: Update random SCP articles

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/generate-articles.mjs

      - name: Commit updated articles
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/articles.json
          git diff --cached --quiet || git commit -m "Update random SCP articles"
          git push
